[package]
name = "atlas"
version = "5.0.0"
edition = "2021"
rust-version = "1.74"
description = "AtlasTunnel — установка и управление VPN-сервером"
license = "MIT"

[[bin]]
name = "atlas"
path = "src/main.rs"

[dependencies]
anyhow = "1"
thiserror = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
fs2 = "0.4"
rand = "0.8"
unicode-width = "0.2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
